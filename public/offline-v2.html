<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>You’re offline · Cafe loyalty</title><style>body{margin:0;background:#fafaf7;color:#111827;font:16px/1.6 system-ui,sans-serif}main{max-width:480px;margin:8vh auto;padding:28px}h1{font-size:24px}p{color:#4b5563}.card{border:1px solid #d1d5db;border-radius:12px;padding:14px;margin:12px 0;background:white}a{display:inline-block;min-height:44px;padding:8px 0;color:#166534}</style></head><body><main><h1>You’re offline</h1><p>Connect to the internet for current balances, purchases, claims and rewards. Saved cards are display only and may be stale.</p><div id="saved"><p>No offline card data is available.</p></div><a href="/app">Try again</a></main><script>
(function(){var req=indexedDB.open('loyalty-offline-v1',1);req.onupgradeneeded=function(){req.result.createObjectStore('state')};req.onsuccess=function(){var db=req.result;var get=db.transaction('state').objectStore('state').get('cards');get.onsuccess=function(){var state=get.result,box=document.getElementById('saved');if(!state||!state.enabled||!Array.isArray(state.cards)||Date.now()-state.fetchedAt>86400000||state.cards.length>20)return;box.replaceChildren();var label=document.createElement('p');label.textContent='Saved '+new Date(state.fetchedAt).toLocaleString('en-PK')+' · offline and possibly stale';box.append(label);state.cards.forEach(function(card){if(!card||typeof card.businessName!=='string'||typeof card.units!=='string')return;var section=document.createElement('section');section.className='card';var title=document.createElement('strong');title.textContent=card.businessName;var info=document.createElement('p');info.textContent=card.units+' '+(card.programmeType==='points'?'points':'stamps')+' · '+card.status;section.append(title,info);box.append(section)});db.close()};get.onerror=function(){db.close()}}})();
</script></body></html>
